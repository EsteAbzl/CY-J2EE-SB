<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des employés</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; margin:0; padding:2rem; min-height:100vh; }
        h2 { text-align:center; color:#fff; margin-bottom:1rem; }
        table { width:100%; border-collapse:collapse; margin:auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        th, td { padding:.75rem; border:1px solid #ddd; text-align:left; }
        th { background:#2a5298; color:#fff; }
        tr:nth-child(even) { background:#f9f9f9; }
        .btn { display:inline-block; background:#2a5298; color:#fff; text-decoration:none; padding:.5rem 1rem; border-radius:8px; font-weight:bold; margin:.25rem; transition:.3s; }
        .btn:hover { background:#1e3c72; cursor: pointer; }
        .btn-danger { background:#c0392b; }
        .btn-danger:hover { background:#962d22; }
        .actions { text-align:center; margin-top:1rem; }
        .search-bar { display: flex; justify-content: center; margin: 20px; }
        .search-bar input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px 0 0 8px; width: 250px; }
        .search-bar button { padding: 0.5rem 1rem; border: none; background: #2a5298; color: white; border-radius: 0 8px 8px 0; cursor: pointer; }
        .search-bar button:hover { background: #1e3c72; }
        .filters { display: flex; justify-content: center; gap: 10px; margin: 20px; flex-wrap: wrap; }
        .filters select { padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px; }
    </style>
</head>
<body>
<h2>Liste des employés</h2>
<div>
    <form action="/employee/list" method="get" class="search-bar">
        <input type="text" name="query" placeholder="Nom, prénom ou matricule">
        <button type="submit">🔍 Rechercher</button>
    </form>
</div>
<form action="/employee/list" method="get" class="filters" id="filters">
    <select name="grade">
        <option value="">-- Grade --</option>
        <option th:each="grade : ${grades}" th:value="${grade}" th:text="${grade}"></option>
    </select>

    <select name="position">
        <option value="">-- Poste --</option>
        <option th:each="position : ${positions}" th:value="${position}" th:text="${position}"></option>
    </select>

    <select name="department">
        <option value="">-- Département --</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
    </select>

    <button type="submit" class="btn">Appliquer</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Grade</th>
        <th>Poste</th>
        <th>ID Département</th>
        <th>Actions</th>
    </tr>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.firstName + ' ' + emp.lastName}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.grade}"></td>
        <td th:text="${emp.positionTitle}"></td>
        <td th:text="${emp.departmentId}"></td>
        <td>
            <a th:href="'/employee/' + ${emp.id}" class="btn">Voir</a>
            <a th:href="'/employee/' + ${emp.id} + '/edit'" class="btn">Éditer</a>
            <form th:action="'/employee/' + ${emp.id} + '/delete'" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
            </form>
        </td>
    </tr>
</table>

<div class="actions">
    <a href="/employee/create/form" class="btn">Ajouter un employé</a>
    <a href="/dashboard" class="btn">Retour au tableau de bord</a>
</div>
</body>
</html>
