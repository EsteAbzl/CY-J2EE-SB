<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un employé</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, select, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        
        #email { cursor:not-allowed; background-color:#f0f0f0; }
        
        .date-group { display:flex; gap:0.5rem; margin-top:.25rem; }
        .date-group select { flex:1; }
        
        .button-group { display:flex; gap:1rem; margin-top:1.5rem; }
        .button-group .btn { flex:1; margin:0; }
        
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; }
        .btn:hover { background:#1e3c72; text-decoration:none; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; text-decoration:none; }
        
        #emailPreview { color:#666; font-size:0.9rem; margin-top:.25rem; font-style:italic; }
    </style>
</head>
<body>
<h2>Ajouter un employé</h2>
<form action="/employee/EmployeeCreateServlet" method="post">
    <label>Prénom</label>
    <input type="text" name="first_name" id="firstName" required>

    <label>Nom</label>
    <input type="text" name="last_name" id="lastName" required>

    <label>Email</label>
    <input type="email" name="email" id="email" readonly>
    <div id="emailPreview">prénom.nom&lt;id&gt;@company.com</div>

    <label>Grade</label>
    <input type="text" name="grade">

    <label>Titre du Poste</label>
    <input type="text" name="position_title">

    <label>Salaire de Base</label>
    <input type="number" name="base_salary" step="0.01" required>

    <label>Département</label>
    <select name="department_id">
        <option value="">-- Sélectionner un département --</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
    </select>

    <label>Date d'embauche (jour/mois/année)</label>
    <div class="date-group">
        <select name="hire_day" required>
            <option value="">Jour</option>
            <option th:each="day : ${#numbers.sequence(1, 31)}" th:value="${day}" th:text="${day}"></option>
        </select>
        <select name="hire_month" required>
            <option value="">Mois</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
        <select name="hire_year" required>
            <option value="">Année</option>
            <option th:each="year : ${#numbers.sequence(2020, 2030)}" th:value="${year}" th:text="${year}"></option>
        </select>
    </div>

    <div class="button-group">
        <a href="/dashboard" class="btn btn-cancel">Annuler</a>
        <button class="btn" type="submit">Créer l'employé</button>
    </div>
</form>

<script>
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('email');
    const emailPreview = document.getElementById('emailPreview');

    function generateEmail() {
        const firstName = firstNameInput.value.trim().toLowerCase();
        const lastName = lastNameInput.value.trim().toLowerCase();
        
        if (firstName && lastName) {
            // Fetch the next employee ID from the server
            fetch('/employee/getNextId')
                .then(response => response.json())
                .then(data => {
                    const nextId = data.nextId;
                    const generatedEmail = firstName + '.' + lastName + nextId + '@company.com';
                    emailInput.value = generatedEmail;
                    emailPreview.textContent = firstName + '.' + lastName + '<' + nextId + '>@company.com';
                })
                .catch(() => {
                    // Fallback if server request fails
                    const generatedEmail = firstName + '.' + lastName + '@company.com';
                    emailInput.value = generatedEmail;
                    emailPreview.textContent = firstName + '.' + lastName + '<id>@company.com';
                });
        } else {
            emailInput.value = '';
            emailPreview.textContent = 'prénom.nom<id>@company.com';
        }
    }

    firstNameInput.addEventListener('input', generateEmail);
    lastNameInput.addEventListener('input', generateEmail);
</script>
</body>
</html>
