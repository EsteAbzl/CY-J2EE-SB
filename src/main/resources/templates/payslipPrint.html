<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Imprimer le bulletin de paie</title>
    <style>
        body { font-family:Arial; padding:2rem; }
        .payslip { border: 1px solid #000; padding: 2rem; max-width:800px; margin:auto; }
        h2 { text-align:center; }
        .row { display:flex; justify-content:space-between; margin:1rem 0; }
        .btn { text-align:center; margin-top:2rem; }
        .btn button { padding:0.5rem 1rem; background:#2a5298; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    </style>
</head>
<body>
<div class="payslip">
    <h2>Bulletin de paie</h2>
    <div class="row">
        <label>Employé ID:</label>
        <span th:text="${payslip.employeeId}"></span>
    </div>
    <div class="row">
        <label>Période:</label>
        <span th:text="${payslip.periodMonth + '/' + payslip.periodYear}"></span>
    </div>
    <hr>
    <div class="row">
        <label>Salaire de base:</label>
        <span th:text="${payslip.baseSalary}"></span>
    </div>
    <div class="row">
        <label>Bonus:</label>
        <span th:text="${payslip.bonuses}"></span>
    </div>
    <div class="row">
        <label>Déductions:</label>
        <span th:text="${payslip.deductions}"></span>
    </div>
    <hr>
    <div class="row">
        <label><strong>Salaire net:</strong></label>
        <span><strong th:text="${payslip.netPay}"></strong></span>
    </div>
</div>

<div class="btn">
    <button onclick="window.print()">Imprimer</button>
</div>
</body>
</html>
