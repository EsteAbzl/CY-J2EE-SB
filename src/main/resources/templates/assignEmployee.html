<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Affecter un employé</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, select, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        .button-group { display:flex; gap:1rem; margin-top:1.5rem; }
        .button-group .btn { flex:1; margin:0; }
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; margin-top:1rem; cursor:pointer; width:100%; text-align:center; text-decoration:none; display:block; }
        .btn:hover { background:#1e3c72; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; }
    </style>
</head>
<body>
<h2>Affecter un employé à un projet</h2>
<form th:action="'/project/assign'" method="post">
    <label>Projet</label>
    <select name="project_id" required>
        <option value="">-- Sélectionner un projet --</option>
        <option th:each="proj : ${projects}" th:value="${proj.id}" th:text="${proj.name}"></option>
    </select>

    <label>Employé</label>
    <select name="employee_id" required>
        <option value="">-- Sélectionner un employé --</option>
        <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.firstName + ' ' + emp.lastName}"></option>
    </select>

    <label>Rôle dans le projet</label>
    <input type="text" name="role_in_project" placeholder="Ex: Développeur, Chef de projet..." required>

    <div class="button-group">
        <a href="/dashboard" class="btn btn-cancel">Annuler</a>
        <button class="btn" type="submit">Affecter</button>
    </div>
</form>
</body>
</html>
