<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page d'erreur</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        .error-container { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); text-align:center; }
        h2 { color:#c0392b; }
        p { color:#333; }
        a { display:inline-block; background:#2a5298; color:#fff; text-decoration:none; padding:.5rem 1rem; border-radius:8px; margin-top:1rem; }
        a:hover { background:#1e3c72; }
    </style>
</head>
<body>
<div class="error-container">
    <h2>Une erreur s'est produite</h2>
    <p th:if="${errorMessage}" th:text="${errorMessage}">
        Une erreur inattendue s'est produite.
    </p>
    <p th:unless="${errorMessage}">
        Veuillez contacter l'administrateur ou réessayer plus tard.
    </p>
    <a href="/login">Retour à la connexion</a>
</div>
</body>
</html>
