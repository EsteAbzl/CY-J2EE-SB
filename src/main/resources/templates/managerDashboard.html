<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord responsable</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; margin:0; padding:2rem; min-height:100vh; }
        h1 { text-align:center; color:#fff; }
        .container { max-width:1200px; margin:auto; }
        .dashboard-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:1rem; margin-bottom:2rem; }
        .dashboard-card { background:#fff; border-radius:12px; padding:1.5rem; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        .dashboard-card h3 { margin-top:0; color:#2a5298; }
        .dashboard-card a { display:inline-block; background:#2a5298; color:#fff; text-decoration:none; padding:.5rem 1rem; border-radius:8px; margin-top:1rem; }
        .dashboard-card a:hover { background:#1e3c72; }
        .logout { text-align:right; }
        .logout a { background:#c0392b; color:#fff; text-decoration:none; padding:.5rem 1rem; border-radius:8px; display:inline-block; }
        .logout a:hover { background:#962d22; }
    </style>
</head>
<body>
<div class="container">
    <h1>Tableau de bord responsable département</h1>
    
    <div class="logout">
        <a href="/logout">Déconnexion</a>
    </div>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h3>Employés du département</h3>
            <p>Voir les employés sous votre responsabilité.</p>
            <a href="/employee/list">Accéder</a>
        </div>

        <div class="dashboard-card">
            <h3>Projets</h3>
            <p>Gérer les projets de votre département.</p>
            <a href="/project/list">Accéder</a>
        </div>

        <div class="dashboard-card">
            <h3>Absences</h3>
            <p>Consulter les absences des employés.</p>
            <a href="/absence/list">Accéder</a>
        </div>

        <div class="dashboard-card">
            <h3>Paies</h3>
            <p>Consulter et gérer les paies.</p>
            <a href="/payslip/list">Accéder</a>
        </div>
    </div>
</div>
</body>
</html>
