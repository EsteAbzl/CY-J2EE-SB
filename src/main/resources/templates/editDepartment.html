<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Éditer le département</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        
        .button-group { display:flex; gap:1rem; margin-top:1.5rem; }
        .button-group .btn { flex:1; margin:0; }
        
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; }
        .btn:hover { background:#1e3c72; text-decoration:none; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; text-decoration:none; }
    </style>
</head>
<body>
<h2>Éditer le département</h2>
<form th:action="'/department/' + ${department.id} + '/update'" method="post">
    <label>Nom du département</label>
    <input type="text" name="name" th:value="${department.name}" required>

    <label>Description</label>
    <textarea name="description" rows="4" th:text="${department.description}"></textarea>

    <div class="button-group">
        <a href="/department/list" class="btn btn-cancel">Annuler</a>
        <button class="btn" type="submit">Mettre à jour le département</button>
    </div>
</form>
</body>
</html>
