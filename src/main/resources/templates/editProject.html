<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Éditer le projet</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, select, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        .button-group { display:flex; gap:1rem; margin-top:1.5rem; }
        .button-group .btn { flex:1; margin:0; }
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; margin-top:1rem; cursor:pointer; width:100%; text-align:center; text-decoration:none; display:block; }
        .btn:hover { background:#1e3c72; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; }
    </style>
</head>
<body>
<h2>Éditer le projet</h2>
<form th:action="'/project/' + ${project.id} + '/update'" method="post">
    <label>Nom du projet</label>
    <input type="text" name="name" th:value="${project.name}" required>

    <label>Description</label>
    <textarea name="description" rows="4" th:text="${project.description}"></textarea>

    <label>Status</label>
    <select name="status">
        <option value="EN_COURS" th:selected="${project.status == 'EN_COURS'}">En cours</option>
        <option value="TERMINE" th:selected="${project.status == 'TERMINE'}">Terminé</option>
        <option value="ANNULE" th:selected="${project.status == 'ANNULE'}">Annulé</option>
    </select>

    <label>Date de début</label>
    <input type="date" name="start_date" th:value="${#dates.format(project.startDate, 'yyyy-MM-dd')}">

    <label>Date de fin</label>
    <input type="date" name="end_date" th:value="${#dates.format(project.endDate, 'yyyy-MM-dd')}">

    <label>Département</label>
    <select name="department_id">
        <option value="">-- Sélectionner un département --</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${dept.id == project.departmentId}"></option>
    </select>

    <div class="button-group">
        <a href="/project/list" class="btn btn-cancel">Annuler</a>
        <button class="btn" type="submit">Mettre à jour le projet</button>
    </div>
</form>
</body>
</html>
