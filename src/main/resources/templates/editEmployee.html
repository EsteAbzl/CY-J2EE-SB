<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Éditer l'employé</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, select, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        
        .salary-section { background:#f0f4f8; padding:1.5rem; border-radius:8px; margin-top:1.5rem; }
        .salary-history { margin-top:1rem; }
        .history-table { width:100%; border-collapse:collapse; margin-top:1rem; }
        .history-table th, .history-table td { padding:.5rem; text-align:left; border-bottom:1px solid #ddd; }
        .history-table th { background:#2a5298; color:#fff; font-weight:bold; }
        .history-table tr:hover { background:#f5f5f5; }
        
        .button-group { display:flex; gap:1rem; margin-top:1.5rem; }
        .button-group .btn { flex:1; margin:0; }
        
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; }
        .btn:hover { background:#1e3c72; text-decoration:none; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; text-decoration:none; }
    </style>
</head>
<body>
<h2>Éditer l'employé</h2>
<form th:action="'/employee/' + ${employee.id} + '/update'" method="post">
    <label>Prénom</label>
    <input type="text" name="first_name" th:value="${employee.firstName}" required>

    <label>Nom</label>
    <input type="text" name="last_name" th:value="${employee.lastName}" required>

    <label>Email</label>
    <input type="email" name="email" th:value="${employee.email}" required>

    <label>Grade</label>
    <input type="text" name="grade" th:value="${employee.grade}">

    <label>Titre du Poste</label>
    <input type="text" name="position_title" th:value="${employee.positionTitle}">

    <div class="salary-section">
        <h3 style="margin-top:0; color:#2a5298;">Gestion du Salaire</h3>
        
        <label>Nouveau Salaire</label>
        <input type="number" name="new_salary" step="0.01" placeholder="Laisser vide pour ne pas modifier">

        <label>Date de mise en vigueur</label>
        <input type="date" name="salary_effective_date" required>
    </div>

    <label>Département</label>
    <select name="department_id">
        <option value="">-- Sélectionner un département --</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${dept.id == employee.departmentId}"></option>
    </select>

    <div class="button-group">
        <a href="/employee/list" class="btn btn-cancel">Annuler</a>
        <button class="btn" type="submit">Mettre à jour l'employé</button>
    </div>
</form>
</body>
</html>
