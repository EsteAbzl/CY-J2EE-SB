<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Éditer l'employé</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, select, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; margin-top:1rem; cursor:pointer; width:100%; }
        .btn:hover { background:#1e3c72; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; }
    </style>
</head>
<body>
<h2>Éditer l'employé</h2>
<form th:action="'/employee/' + ${employee.id} + '/update'" method="post">
    <label>Prénom</label>
    <input type="text" name="first_name" th:value="${employee.firstName}" required>

    <label>Nom</label>
    <input type="text" name="last_name" th:value="${employee.lastName}" required>

    <label>Email</label>
    <input type="email" name="email" th:value="${employee.email}" required>

    <label>Grade</label>
    <input type="text" name="grade" th:value="${employee.grade}">

    <label>Titre du Poste</label>
    <input type="text" name="position_title" th:value="${employee.positionTitle}">

    <label>Salaire de Base</label>
    <input type="number" name="base_salary" step="0.01" th:value="${employee.baseSalary}" required>

    <label>Département</label>
    <select name="department_id">
        <option value="">-- Sélectionner un département --</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${dept.id == employee.departmentId}"></option>
    </select>

    <button class="btn" type="submit">Mettre à jour l'employé</button>
    <a href="/employee/list" class="btn btn-cancel">Annuler</a>
</form>
</body>
</html>
