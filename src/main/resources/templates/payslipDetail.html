<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consultation Fiche de Paie</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 3px solid #2a5298;
            padding-bottom: 1.5rem;
        }

        .header h1 {
            color: #2a5298;
            margin: 0;
            font-size: 1.8rem;
        }

        .header .employee-name {
            color: #666;
            font-size: 1.3rem;
            margin-top: 0.5rem;
        }

        .header .period {
            color: #999;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .generated-date {
            color: #999;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
        }

        th, td {
            padding: 1rem;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2a5298;
            color: #fff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .label {
            width: 40%;
            font-weight: bold;
            color: #2a5298;
        }

        .value {
            text-align: right;
        }

        .details-section {
            margin: 2rem 0;
        }

        .details-section h3 {
            color: #2a5298;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #2a5298;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .details-table th, .details-table td {
            padding: 0.75rem;
            border: 1px solid #ddd;
            text-align: left;
        }

        .details-table th {
            background: #f0f0f0;
            color: #2a5298;
            font-weight: bold;
        }

        .details-table .montant {
            text-align: right;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            padding: 1rem;
            text-align: center;
        }

        .footer-info {
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #ddd;
        }

        .actions {
            text-align: center;
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            background: #2a5298;
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            margin: 0 0.5rem;
        }

        .btn:hover {
            background: #1e3c72;
        }

        .btn-print {
            background: #27ae60;
        }

        .btn-print:hover {
            background: #229954;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Fiche de Paie</h1>
        <div class="employee-name" th:text="${employeeName}"></div>
        <div class="period">
            <span th:text="${payslip.periodMonth}"></span>/<span th:text="${payslip.periodYear}"></span>
        </div>
        <div class="generated-date">
            Généré le: <span th:text="${#dates.format(payslip.generatedAt, 'dd/MM/yyyy HH:mm:ss')}"></span>
        </div>
    </div>

    <!-- Informations principales -->
    <table>
        <tr>
            <td class="label">Nom et Prénom</td>
            <td class="value" th:text="${employeeName}"></td>
        </tr>
        <tr>
            <td class="label">Salaire de base</td>
            <td class="value" th:text="${#numbers.formatDecimal(payslip.baseSalary, 1, 2)}"></td>
        </tr>
    </table>

    <!-- Section Bonus -->
    <div class="details-section">
        <h3>Bonus</h3>
        <table class="details-table" th:if="${bonuses.size() > 0}">
            <tr>
                <th>Motif</th>
                <th class="montant">Montant</th>
            </tr>
            <tr th:each="bonus : ${bonuses}">
                <td th:text="${bonus.motif}"></td>
                <td class="montant" th:text="'+' + ${bonus.montant} + ' €'"></td>
            </tr>
        </table>
        <div th:if="${bonuses.size() == 0}" class="empty-message">
            Aucun bonus
        </div>
    </div>

    <!-- Section Malus/Déductions -->
    <div class="details-section">
        <h3>Malus / Déductions</h3>
        <table class="details-table" th:if="${deductions.size() > 0}">
            <tr>
                <th>Motif</th>
                <th class="montant">Montant</th>
            </tr>
            <tr th:each="deduction : ${deductions}">
                <td th:text="${deduction.motif}"></td>
                <td class="montant" th:text="'-' + ${deduction.montant} + ' €'"></td>
            </tr>
        </table>
        <div th:if="${deductions.size() == 0}" class="empty-message">
            Aucune déduction
        </div>
    </div>

    <!-- Résumé final -->
    <table>
        <tr>
            <td class="label">Net à payer</td>
            <td class="value" th:text="${#numbers.formatDecimal(payslip.netPay, 1, 2)} + ' €'"></td>
        </tr>
    </table>

    <div class="footer-info">
        ID Fiche: <span th:text="${payslip.id}"></span>
    </div>

    <div class="actions">
        <a href="/payslip/list" class="btn">← Retour</a>
        <button class="btn btn-print" onclick="window.print()">Imprimer</button>
    </div>
</div>
</body>
</html>
