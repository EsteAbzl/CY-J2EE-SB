<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un employé</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; padding:2rem; min-height:100vh; margin:0; }
        h2 { text-align:center; color:#fff; }
        form { background:#fff; border-radius:12px; padding:2rem; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        label { display:block; margin-top:1rem; font-weight:bold; color:#2a5298; }
        input, select, textarea { width:100%; padding:.5rem; border:1px solid #ccc; border-radius:8px; margin-top:.25rem; box-sizing: border-box; }
        .btn { background:#2a5298; color:#fff; border:none; padding:.75rem; border-radius:8px; font-weight:bold; margin-top:1rem; cursor:pointer; width:100%; }
        .btn:hover { background:#1e3c72; }
        .btn-cancel { background:#95a5a6; }
        .btn-cancel:hover { background:#7f8c8d; }
    </style>
</head>
<body>
<h2>Ajouter un employé</h2>
<form action="/employee/EmployeeCreateServlet" method="post">
    <label>Prénom</label>
    <input type="text" name="first_name" required>

    <label>Nom</label>
    <input type="text" name="last_name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Grade</label>
    <input type="text" name="grade">

    <label>Titre du Poste</label>
    <input type="text" name="position_title">

    <label>Salaire de Base</label>
    <input type="number" name="base_salary" step="0.01" required>

    <label>Département</label>
    <select name="department_id">
        <option value="">-- Sélectionner un département --</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
    </select>

    <label>Date d'embauche</label>
    <div>
        <select name="hire_day">
            <option value="">Jour</option>
            <option th:each="day : ${#numbers.sequence(1, 31)}" th:value="${day}" th:text="${day}"></option>
        </select>
        <select name="hire_month">
            <option value="">Mois</option>
            <option th:each="month : ${#numbers.sequence(1, 12)}" th:value="${month}" th:text="${month}"></option>
        </select>
        <select name="hire_year">
            <option value="">Année</option>
            <option th:each="year : ${#numbers.sequence(2020, 2030)}" th:value="${year}" th:text="${year}"></option>
        </select>
    </div>

    <button class="btn" type="submit">Créer l'employé</button>
    <a href="/employee/list" class="btn btn-cancel">Annuler</a>
</form>
</body>
</html>
