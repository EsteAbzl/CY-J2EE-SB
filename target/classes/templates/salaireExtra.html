<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des salaires supplémentaires</title>
    <style>
        body { background:linear-gradient(135deg,#1e3c72,#2a5298); font-family:Arial; margin:0; padding:2rem; min-height:100vh; }
        h2 { text-align:center; color:#fff; margin-bottom:1rem; }
        table { width:100%; border-collapse:collapse; margin:auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.25); margin-bottom: 2rem; }
        th, td { padding:.75rem; border:1px solid #ddd; text-align:left; }
        th { background:#2a5298; color:#fff; }
        tr:nth-child(even) { background:#f9f9f9; }
        .btn { display:inline-block; background:#2a5298; color:#fff; text-decoration:none; padding:.5rem 1rem; border-radius:8px; font-weight:bold; margin:.25rem; transition:.3s; }
        .btn:hover { background:#1e3c72; cursor: pointer; }
        .actions { text-align:center; margin-top:1rem; }
    </style>
</head>
<body>
<h2>Gestion des salaires supplémentaires</h2>
<table>
    <tr>
        <th>ID</th>
        <th>ID Employé</th>
        <th>Montant</th>
        <th>Motif</th>
        <th>Date</th>
    </tr>
    <tr th:each="extra : ${extras}">
        <td th:text="${extra.id}"></td>
        <td th:text="${extra.employeeId}"></td>
        <td th:text="${extra.montant}"></td>
        <td th:text="${extra.motif}"></td>
        <td th:text="${extra.date}"></td>
    </tr>
</table>

<div class="actions">
    <a href="/dashboard.jsp" class="btn">Retour au tableau de bord</a>
</div>
</body>
</html>
